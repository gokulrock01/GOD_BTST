name: Automated BTST Options Trader (NSE)

on:
  schedule:
    # 09:45 AM UTC = 3:15 PM IST (Monday to Friday) - EOD 3:15 PM BTST Screener
    - cron: '45 9 * * 1-5'
    # 03:45 AM UTC = 9:15 AM IST (Monday to Friday) - Market Open Exit Monitor
    - cron: '45 3 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode to run'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - morning-exit

jobs:
  run-btst-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TZ: 'Asia/Kolkata'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine execution mode
        id: exec-mode
        run: |
          # If manual dispatch, use the chosen input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            # Check current time in IST
            CURRENT_TIME=$(date +'%H:%M')
            echo "Current IST time: $CURRENT_TIME"
            # 14:45 to 16:00 IST -> 3:15 PM scan
            if [[ "$CURRENT_TIME" > "14:45" && "$CURRENT_TIME" < "16:00" ]]; then
              echo "mode=scan" >> $GITHUB_OUTPUT
            # 09:00 to 10:30 IST -> 9:15 AM morning-exit
            elif [[ "$CURRENT_TIME" > "09:00" && "$CURRENT_TIME" < "10:30" ]]; then
              echo "mode=morning-exit" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Current IST time ($CURRENT_TIME) is outside valid trading windows (09:15 exit or 15:15 scan)."
              echo "Run was delayed or triggered outside market hours. Aborting to protect capital."
              echo "mode=skip" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run BTST Orderflow Automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BTST_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.SWING_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BTST_ID || secrets.TELEGRAM_CHAT_ID || secrets.GOD_SWING_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
        run: |
          if [ "${{ steps.exec-mode.outputs.mode }}" = "skip" ]; then
            echo "⏭️ Execution skipped because trigger arrived outside market windows."
          else
            python automation_engine.py --mode ${{ steps.exec-mode.outputs.mode }}
          fi

      - name: Commit and push updated signals
        if: always()
        run: |
          git config --global user.name "GodBTST-Bot"
          git config --global user.email "bot@godbtst.local"
          git add signals/
          git commit -m "Auto-update BTST signals [$(date +'%Y-%m-%d %H:%M IST')]" || echo "No new signals to commit"
          git pull --rebase origin main || true
          git push origin main || echo "Push skipped"
